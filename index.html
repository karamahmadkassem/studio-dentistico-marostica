<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/brand/favicon.png" />
    <link rel="preload" as="image" href="/images/home/hero/animation/frame_001.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/images/home/hero/background.jpg" />
    <link rel="preload" as="image" href="/images/home/hero/teeth.png" />
    <link rel="preload" as="image" href="/images/brand/logo.png" />
    <link
      rel="preload"
      href="/fonts/elite-danger/EliteDangerBold-gYLp.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/elite-danger/EliteDanger-P0EZ.otf"
      as="font"
      type="font/otf"
      crossorigin
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000340" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Studio Dentistico Marostica</title>
    <style>
      html.hero-boot-loading,
      html.hero-boot-loading body {
        background: #000340;
        overflow: hidden;
      }

      #hero-splash-static {
        position: fixed;
        inset: 0;
        z-index: 10000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        background-color: #000340;
        background-image: linear-gradient(135deg, #030d1d 0%, #000340 35%, #001458 65%, #000228 100%);
        color: #fff;
        font-family: Manrope, system-ui, sans-serif;
      }

      html.hero-boot-ready #hero-splash-static {
        display: none;
      }

      #hero-splash-static .hero-splash__content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
        width: min(100%, 28rem);
        text-align: center;
      }

      #hero-splash-static .hero-splash__logo {
        display: block;
        width: min(220px, 70vw);
        height: auto;
        filter: drop-shadow(0 8px 28px rgba(0, 0, 0, 0.45));
      }

      #hero-splash-static .hero-splash__quote {
        margin: 0;
        font-family: Manrope, system-ui, sans-serif;
        font-size: clamp(1.05rem, 3.5vw, 1.25rem);
        font-weight: 500;
        font-style: normal;
        line-height: 1.55;
        color: rgba(255, 255, 255, 0.92);
      }

      #hero-splash-static .hero-splash__loading {
        margin: 0;
        font-family: Manrope, system-ui, sans-serif;
        font-size: 0.875rem;
        font-weight: 600;
        font-style: normal;
        letter-spacing: 0.04em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.55);
      }

      #hero-splash-static .hero-splash__progress-track {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 4px;
        background: #000340;
        overflow: hidden;
      }

      #hero-splash-static .hero-splash__progress-bar {
        height: 100%;
        width: 8%;
        background: linear-gradient(90deg, #1a6fa8, #4aace1, #a8e4ff, #4aace1, #1a6fa8);
        background-size: 220% 100%;
      }

      html.hero-boot-minimal #hero-splash-static .hero-splash__quote,
      html.hero-boot-minimal #hero-splash-static .hero-splash__loading {
        display: none;
      }
    </style>
    <script>
      (function () {
        var path = window.location.pathname;
        var warmed = sessionStorage.getItem('sdm-hero-warmed') === '1';
        if (path !== '/') {
          document.documentElement.className = 'hero-boot-ready';
        } else if (warmed) {
          document.documentElement.className = 'hero-boot-loading hero-boot-minimal';
        } else {
          document.documentElement.className = 'hero-boot-loading';
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <meta name="description" content="Studio Dentistico Marostica - Cure dentali di alta qualità a Marostica. Prenota una visita oggi stesso." />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Dentist",
        "name": "Studio Dentistico Marostica",
        "url": "https://www.studiodentisticomarostica.com",
        "telephone": ["+393518228984", "+39042473061"],
        "email": "info@studiodentisticomarostica.it",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Via XXIV Maggio 39",
          "addressLocality": "Marostica",
          "addressRegion": "VI",
          "addressCountry": "IT"
        }
      }
    </script>
  </head>
  <body>
    <div id="hero-splash-static" aria-hidden="true">
      <div class="hero-splash__content">
        <img class="hero-splash__logo" src="/images/brand/logo.png" alt="" width="220" height="80" />
        <p class="hero-splash__quote">A healthy smile starts with good prevention.</p>
        <p class="hero-splash__loading">Getting your smile ready…</p>
      </div>
      <div class="hero-splash__progress-track" aria-hidden="true">
        <div class="hero-splash__progress-bar"></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
